name: FIRETracker
options:
  bundleIdPrefix: com.vincentvillalta
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FIRETracker:
    type: application
    platform: iOS
    sources:
      - Sources/FIRETracker
      - Sources/Shared
    info:
      path: Sources/FIRETracker/Resources/Info.plist
      properties:
        CFBundleDisplayName: FIRE Tracker
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincentvillalta.firetracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: false
    dependencies:
      - target: FIRETrackerWatchApp
    scheme:
      testTargets:
        - FIRETrackerTests
  FIRETrackerWatchApp:
    type: application
    platform: watchOS
    sources:
      - Sources/FIRETrackerWatchApp
      - Sources/Shared
    info:
      path: Sources/FIRETrackerWatchApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: FIRE
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.vincentvillalta.firetracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincentvillalta.firetracker.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  FIRETrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FIRETrackerTests
    dependencies:
      - target: FIRETracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vincentvillalta.firetracker.tests
        GENERATE_INFOPLIST_FILE: YES
