name: FIRETracker
options:
  bundleIdPrefix: com.vv
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
settings:
  base:
    SWIFT_VERSION: "6.2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  FIRETracker:
    type: application
    platform: iOS
    sources:
      - path: Sources/FIRETracker
        excludes:
          - Resources/AppIcon.icon
      - path: Sources/FIRETracker/Resources/AppIcon.icon
        type: folder
      - Sources/Shared
    info:
      path: Sources/FIRETracker/Resources/Info.plist
      properties:
        CFBundleDisplayName: FIRE Tracker
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vv.firetracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: false
    dependencies:
      - target: FIRETrackerWatchApp
    scheme:
      testTargets:
        - FIRETrackerTests
  FIRETrackerWatchApp:
    type: application
    platform: watchOS
    sources:
      - path: Sources/FIRETrackerWatchApp
        excludes:
          - Resources/AppIcon.icon
      - path: Sources/FIRETrackerWatchApp/Resources/AppIcon.icon
        type: folder
      - Sources/Shared
    info:
      path: Sources/FIRETrackerWatchApp/Resources/Info.plist
      properties:
        CFBundleDisplayName: FIRE
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.vv.firetracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vv.firetracker.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
  FIRETrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FIRETrackerTests
    dependencies:
      - target: FIRETracker
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vv.firetracker.tests
        GENERATE_INFOPLIST_FILE: YES
